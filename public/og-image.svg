<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0a0d12"/>
      <stop offset="60%" stop-color="#15191f"/>
      <stop offset="100%" stop-color="#06080c"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0%" stop-color="#1a2030" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06080c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#9bd4ec"/>
      <stop offset="55%" stop-color="#3e7e9c"/>
      <stop offset="100%" stop-color="#0d2a36"/>
    </linearGradient>
    <linearGradient id="visorOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffe39a"/>
      <stop offset="55%" stop-color="#d97757"/>
      <stop offset="100%" stop-color="#3a1408"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- top accent line -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#6fe1f3" stroke-width="2" opacity="0.4"/>

  <!-- HUD-style notch echo (centered) -->
  <g transform="translate(600 70)">
    <g transform="skewX(-10)">
      <rect x="-90" y="-18" width="180" height="36" rx="6"
            fill="#15191f" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <line x1="-90" y1="-17" x2="90" y2="-17" stroke="#6fe1f3" stroke-width="1" opacity="0.55"/>
    </g>
    <text x="0" y="5" text-anchor="middle"
          font-family="Inter, sans-serif" font-size="11" font-weight="500"
          letter-spacing="6" fill="#c8ccd2">LLM ARENA</text>
  </g>

  <!-- LEFT HELMET (cyan visor) -->
  <g transform="translate(220 310)">
    <path d="M 60,8 L 130,8 L 175,40 L 195,90 L 200,180 L 175,250 L 145,275
             L 60,275 L 35,250 L 20,180 L 25,90 L 45,40 Z"
          fill="#3a4250" stroke="#11141a" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 50,20 L 130,15 L 165,40 L 110,30 L 70,40 Z" fill="#525c6e"/>
    <path d="M 28,110 L 192,110 L 188,128 L 30,128 Z" fill="#1a1f28"/>
    <path d="M 22,128 L 198,128 L 205,180 L 18,180 Z" fill="#070a0d"/>
    <path d="M 30,138 L 190,138 L 195,172 L 25,172 Z" fill="url(#visor)"/>
    <path d="M 32,140 L 188,140 L 186,150 L 30,152 Z" fill="#bff5ff" opacity="0.5"/>
    <path d="M 35,200 L 175,200 L 165,255 L 110,275 L 50,255 Z"
          fill="#2f3640" stroke="#11141a" stroke-width="2" stroke-linejoin="round"/>
    <rect x="80" y="240" width="60" height="14" rx="2" fill="#0d1015"/>
    <circle cx="0" cy="160" r="22" fill="#2e3543" stroke="#11141a" stroke-width="2"/>
    <circle cx="0" cy="160" r="14" fill="#0e1116"/>
  </g>

  <!-- RIGHT HELMET (orange visor — mirrored) -->
  <g transform="translate(980 310) scale(-1 1)">
    <path d="M 60,8 L 130,8 L 175,40 L 195,90 L 200,180 L 175,250 L 145,275
             L 60,275 L 35,250 L 20,180 L 25,90 L 45,40 Z"
          fill="#3a4250" stroke="#11141a" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 50,20 L 130,15 L 165,40 L 110,30 L 70,40 Z" fill="#525c6e"/>
    <path d="M 28,110 L 192,110 L 188,128 L 30,128 Z" fill="#1a1f28"/>
    <path d="M 22,128 L 198,128 L 205,180 L 18,180 Z" fill="#070a0d"/>
    <path d="M 30,138 L 190,138 L 195,172 L 25,172 Z" fill="url(#visorOrange)"/>
    <path d="M 32,140 L 188,140 L 186,150 L 30,152 Z" fill="#fff5c8" opacity="0.5"/>
    <path d="M 35,200 L 175,200 L 165,255 L 110,275 L 50,255 Z"
          fill="#2f3640" stroke="#11141a" stroke-width="2" stroke-linejoin="round"/>
    <rect x="80" y="240" width="60" height="14" rx="2" fill="#0d1015"/>
    <circle cx="0" cy="160" r="22" fill="#2e3543" stroke="#11141a" stroke-width="2"/>
    <circle cx="0" cy="160" r="14" fill="#0e1116"/>
  </g>

  <!-- VS marker -->
  <g transform="translate(600 460)">
    <line x1="-90" y1="-50" x2="-30" y2="-50" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <line x1="30"  y1="-50" x2="90"  y2="-50" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <text x="0" y="-30" text-anchor="middle"
          font-family="Inter, sans-serif" font-size="68" font-weight="100"
          letter-spacing="14" fill="#ffffff">VS</text>
  </g>

  <!-- title + tagline -->
  <g transform="translate(600 540)" text-anchor="middle" font-family="Inter, sans-serif">
    <text y="0" font-size="44" font-weight="200" letter-spacing="6"
          fill="#e8ebf0">PICK · BRIEF · FIGHT · JUDGE</text>
    <text y="36" font-size="16" font-weight="300" letter-spacing="2"
          fill="#8b929d">Pit two language models against each other.</text>
  </g>

  <!-- corner URL -->
  <text x="1160" y="608" text-anchor="end"
        font-family="Inter, sans-serif" font-size="11" font-weight="500"
        letter-spacing="4" fill="#6e747e">llm-arena.app</text>

  <!-- corner brand mark -->
  <text x="40" y="608"
        font-family="Inter, sans-serif" font-size="14"
        fill="#6fe1f3">◆</text>
</svg>
