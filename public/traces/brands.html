<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Helmet Brand Variants</title>
<style>
  body {
    margin: 0;
    background: #0e1116;
    padding: 24px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #c8ccd2;
  }
  .container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

  .row {
    position: relative;
    background: #ffffff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 8px 24px -12px rgba(0,0,0,0.5);
  }
  .row img { display: block; width: 100%; }

  .label {
    position: absolute;
    top: 12px; left: 14px;
    font-size: 10px;
    letter-spacing: .35em;
    text-transform: uppercase;
    color: #2a2d33;
    background: rgba(255,255,255,0.92);
    padding: 5px 10px;
    border-radius: 4px;
    z-index: 10;
    backdrop-filter: blur(4px);
  }
  .label .swatch {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; margin-right: 6px;
    vertical-align: middle;
    border: 1px solid rgba(0,0,0,0.15);
  }

  .logo {
    position: absolute;
    width: 4.28%;
    aspect-ratio: 1;
    /* perspective: shrink the LEFT edge back into the helmet,
       since each ear plate disc faces slightly toward viewer-left */
    transform: translate(-50%, -50%) perspective(100px) rotateY(-34deg);
    transform-origin: center;
    z-index: 5;
    pointer-events: none;
  }
  .logo svg { width: 100%; height: 100%; display: block; overflow: visible; }

  /* ear plate positions (tweak these to nudge logos) */
  .l1 { left: 7.8%;  top: 52%; }
  .l2 { left: 39.5%; top: 51%; }
  .l3 { left: 71.7%; top: 52%; width: 4.56%; }
</style>
</head>
<body>
<div class="container" id="container"></div>

<script>
/* ===== brand configs ===== */
const BRANDS = [
  { slug:'stock',     name:'Stock',     color:'#1de2da', filter:'none' },
  { slug:'openai',    name:'OpenAI',    color:'#10a37f', filter:'hue-rotate(-15deg) saturate(0.85)' },
  { slug:'xai',       name:'xAI',       color:'#9aa0a6', filter:'saturate(0) brightness(1.05)' },
  { slug:'anthropic', name:'Anthropic', color:'#d97757', filter:'hue-rotate(-165deg) saturate(1.4)' },
  { slug:'meta',      name:'Meta',      color:'#0866ff', filter:'hue-rotate(45deg) saturate(1.6)' },
  { slug:'deepseek',  name:'DeepSeek',  color:'#4d6bfe', filter:'hue-rotate(60deg) saturate(1.5)' },
  { slug:'gemini',    name:'Gemini',    color:'#9168c0', filter:'hue-rotate(95deg) saturate(1.2)' },
  { slug:'mistral',   name:'Mistral',   color:'#ff5d00', filter:'hue-rotate(-155deg) saturate(1.8)' },
];

/* ===== logo SVG fragments (centered on 0,0, viewBox -20..20) ===== */
const LOGOS = {
  openai: `
    <g stroke="#ffffff" stroke-width="2.6" fill="none" stroke-linecap="round">
      <ellipse rx="15" ry="6"/>
      <ellipse rx="15" ry="6" transform="rotate(60)"/>
      <ellipse rx="15" ry="6" transform="rotate(120)"/>
    </g>`,
  xai: `
    <g stroke="#ffffff" stroke-width="4" stroke-linecap="square">
      <line x1="-11" y1="-12" x2="11" y2="12"/>
      <line x1="11" y1="-12" x2="-11" y2="12"/>
    </g>`,
  anthropic: `
    <g fill="#ffffff" stroke="none">
      <path d="M -2,-16 L 2,-16 L 4,-3 L 16,-8 L 17,-3 L 5,2 L 13,12 L 9,15 L 1,5 L -2,17 L -7,15 L -4,3 L -16,8 L -17,3 L -5,-2 L -13,-12 L -9,-15 L -2,-5 Z"/>
    </g>`,
  meta: `
    <g fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -16,3 C -16,-9 -6,-12 0,-3 C 4,3 8,9 12,9 C 17,9 17,3 14,-3 C 11,-9 5,-9 0,-3 C -5,4 -11,11 -15,8 Z"/>
    </g>`,
  deepseek: `
    <g fill="#ffffff" stroke="none">
      <path d="M -16,-2 C -13,-10 -5,-12 2,-9 C 9,-6 14,-1 17,4 C 14,3 11,2 8,3 C 5,7 1,9 -3,8 C -9,7 -15,4 -16,0 Z"/>
      <circle cx="-8" cy="-4" r="1.6" fill="#0e1116"/>
    </g>`,
  gemini: `
    <g>
      <defs>
        <linearGradient id="gemGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"  stop-color="#4796ff"/>
          <stop offset="55%" stop-color="#bd6cd0"/>
          <stop offset="100%" stop-color="#ff7a8e"/>
        </linearGradient>
      </defs>
      <path d="M 0,-17 C 2,-6 6,-2 17,0 C 6,2 2,6 0,17 C -2,6 -6,2 -17,0 C -6,-2 -2,-6 0,-17 Z" fill="url(#gemGrad)"/>
    </g>`,
  mistral: `
    <g stroke="none">
      <rect x="-15" y="-12" width="30" height="6" fill="#ffd400"/>
      <rect x="-15" y="-6"  width="30" height="6" fill="#ff8800"/>
      <rect x="-15" y="0"   width="30" height="6" fill="#ff5d00"/>
      <rect x="-15" y="6"   width="30" height="6" fill="#e02b00"/>
      <rect x="-9"  y="-6"  width="6"  height="18" fill="#0e1116"/>
      <rect x="3"   y="-6"  width="6"  height="18" fill="#0e1116"/>
    </g>`,
};

/* ===== render ===== */
const container = document.getElementById('container');
container.innerHTML = BRANDS.map((b, i) => {
  const logoSvg = b.slug === 'stock' || !LOGOS[b.slug]
    ? ''
    : ['l1','l2','l3'].map(slot =>
        `<div class="logo ${slot}"><svg viewBox="-20 -20 40 40">${LOGOS[b.slug]}</svg></div>`
      ).join('');

  return `
    <div class="row ${b.slug}">
      <div class="label"><span class="swatch" style="background:${b.color}"></span>${b.name}</div>
      <img src="helmets-v3.svg" style="filter:${b.filter}">
      ${logoSvg}
    </div>
  `;
}).join('');
</script>
</body>
</html>
