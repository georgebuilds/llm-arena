<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Robot Helmet Tiers — Brand Variants</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #f4f5f7;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #2a2d33;
    padding: 32px 24px 60px;
  }
  .stack { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: grid;
    grid-template-columns: 90px repeat(3, 1fr);
    align-items: center;
    column-gap: 12px;
    padding: 8px 4px;
    border-bottom: 1px solid #e5e7ea;
  }
  .row:last-child { border-bottom: none; }
  .row-label {
    font-size: 10px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #6b7079;
    font-weight: 500;
  }
  .row-label .swatch {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 6px; vertical-align: middle;
  }
  .helm { display: flex; justify-content: center; }
  .helm svg { width: 100%; max-width: 240px; height: auto; display: block; }
  .head {
    display: grid;
    grid-template-columns: 90px repeat(3, 1fr);
    column-gap: 12px;
    padding: 0 4px 12px;
    margin-bottom: 4px;
    border-bottom: 1px solid #d8dade;
  }
  .head .col {
    font-size: 10px; letter-spacing: .35em; text-transform: uppercase;
    color: #8b8f96; text-align: center;
  }
</style>
</head>
<body>
<div class="stack">
  <div class="head">
    <div></div>
    <div class="col">Basic</div>
    <div class="col">Advance</div>
    <div class="col">Ultra</div>
  </div>
  <div id="rows"></div>
</div>

<script>
/* ============================================================
   PALETTE — body always gunmetal, only visor + logo change
   ============================================================ */
const BASE = {

  body:       '#8c9098',
  bodyMid:    '#6f747c',

  bodyDeep:   '#2e3138',
  slot:       '#0a0c10',
  rivet:      '#1a1d23',

/* ============================================================

   each returns an SVG fragment centered on (0,0), sized ~±18

const LOGOS = {

   BRAND CONFIGS
   ============================================================ */

/* ============================================================
   HELMET TEMPLATES
   ============================================================ */

function visorDefs(id, color, isGradient) {
  if (isGradient) {
    return `<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4796ff"/>
      <stop offset="55%" stop-color="#9168c0"/>
      <stop offset="100%" stop-color="#e95688"/>
    </linearGradient>`;
  }
  return `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="${lighten(color, 0.55)}"/>
    <stop offset="55%" stop-color="${color}"/>
    <stop offset="100%" stop-color="${darken(color, 0.55)}"/>
  </linearGradient>`;
}

function lighten(hex, amt) {
  const c = hexToRgb(hex);
  return rgbToHex(
    Math.round(c.r + (255 - c.r) * amt),
    Math.round(c.g + (255 - c.g) * amt),
    Math.round(c.b + (255 - c.b) * amt),
  );
}
function darken(hex, amt) {
  const c = hexToRgb(hex);
  return rgbToHex(
    Math.round(c.r * (1 - amt)),
    Math.round(c.g * (1 - amt)),
    Math.round(c.b * (1 - amt)),
  );
}
function hexToRgb(h) {
  const s = h.replace('#','');
  return { r: parseInt(s.slice(0,2),16), g: parseInt(s.slice(2,4),16), b: parseInt(s.slice(4,6),16) };
}
function rgbToHex(r,g,b){
  const t = n => n.toString(16).padStart(2,'0');
  return '#' + t(r)+t(g)+t(b);
}

/* ============= EAR PLATE (shared) ============= */
function earPlate(cx, cy, r, logoFn) {
  return `
    <circle cx="${cx}" cy="${cy}" r="${r+4}" fill="${BASE.bodyDark}" stroke="${BASE.outline}" stroke-width="2"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="${BASE.bodyDeep}" stroke="${BASE.outline}" stroke-width="1.5"/>
    <circle cx="${cx}" cy="${cy}" r="${r-3}" fill="#0e1116"/>
    ${logoFn ? `<g transform="translate(${cx},${cy})">${logoFn()}</g>` : ''}
    <!-- bolts -->
    <circle cx="${cx-r-2}" cy="${cy-r-1}" r="1.4" fill="${BASE.rivet}"/>
    <circle cx="${cx+r+2}" cy="${cy-r-1}" r="1.4" fill="${BASE.rivet}"/>
    <circle cx="${cx-r-2}" cy="${cy+r+1}" r="1.4" fill="${BASE.rivet}"/>
    <circle cx="${cx+r+2}" cy="${cy+r+1}" r="1.4" fill="${BASE.rivet}"/>
  `;
}

/* ============================================================
   ROW RENDERER
   ============================================================ */
function row(brand, idx) {
  const label = brand
    ? `<div class="row-label"><span class="swatch" style="background:${brand.color}"></span>${brand.name}</div>`
    : `<div class="row-label">Stock</div>`;
  return `
    <div class="row">
      ${label}
      <div class="helm">${helmetBasic(brand, idx)}</div>
      <div class="helm">${helmetAdvance(brand, idx)}</div>
      <div class="helm">${helmetUltra(brand, idx)}</div>
    </div>
  `;
}

document.getElementById('rows').innerHTML = BRANDS.map((b, i) => row(b, i)).join('');
